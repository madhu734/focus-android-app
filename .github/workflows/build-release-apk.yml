name: Build & Release Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Release Keystore
        run: |
          rm -f app/release-key.jks
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -alias focus_prod_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass FocusProd2026Pass \
            -keypass FocusProd2026Pass \
            -dname "CN=FocusApp, OU=Mobile, O=Personal, L=Dhaka, S=Dhaka, C=BD"

      - name: Setup Gradle & Build Release APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          arguments: assembleRelease --no-daemon --stacktrace

      - name: Prepare Signed APK File
        run: |
          cp app/build/outputs/apk/release/*.apk Focus-Signed-Release.apk
          ls -lh Focus-Signed-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Signed-Release-APK
          path: Focus-Signed-Release.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 Focus-Signed-Release.apk \
            --title "Focus v1.0.0 (Signed Universal APK)" \
            --notes "Automated V1/V2/V3 Signed Release APK built from Google AI Studio sync."
